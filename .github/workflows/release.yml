name: Verify and release Windows installer

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ZT_PYTHON_VERSION: '3.12.10'
  PYTHONUTF8: '1'

jobs:
  test:
    name: Validate source and test on PostgreSQL 18.6
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      POSTGRES_TEST_URL: postgresql://zt_ci@127.0.0.1:55439/zerotrust_test?connect_timeout=5
      DATABASE_URL: postgresql://zt_ci@127.0.0.1:55439/zerotrust_test?connect_timeout=5
      SECRET_KEY: ci-only-disposable-test-secret-not-for-production-123456
      JWT_ALGORITHM: HS256
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Use a new vMAJOR.MINOR.PATCH release tag.'
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The tagged commit must already be included in origin/main.'
          }

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.ZT_PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: source/requirements*.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install -r source/requirements-release.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check code conventions
        run: |
          python source/scripts/check_code_conventions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare pinned PostgreSQL runtime
        run: ./.github/scripts/setup-postgres.ps1 -Destination "$env:RUNNER_TEMP/zt-postgres"

      - name: Start disposable test database
        run: |
          $pgBin = Join-Path $env:ZT_PG_ROOT 'bin'
          $testData = Join-Path $env:RUNNER_TEMP 'zt-test-pgdata'
          $testLog = Join-Path $env:RUNNER_TEMP 'zt-test-postgres.log'
          & "$pgBin/initdb.exe" -D $testData -U zt_ci --auth=trust --encoding=UTF8 --locale=C
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pgBin/pg_ctl.exe" -D $testData -l $testLog -o '-h 127.0.0.1 -p 55439' -w start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pgBin/createdb.exe" -h 127.0.0.1 -p 55439 -U zt_ci zerotrust_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require test database connection
        run: |
          @'
          import os
          import psycopg2
          with psycopg2.connect(os.environ['POSTGRES_TEST_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute('SELECT current_database(), current_user')
                  assert cur.fetchone() == ('zerotrust_test', 'zt_ci')
          print('Isolated test database connected')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full regression suite
        working-directory: source
        run: |
          python -m pytest tests -q -ra --junitxml="$env:RUNNER_TEMP/pytest-results.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify migrations are repeatable
        working-directory: source
        run: |
          python scripts/run_migrations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop test database
        if: always()
        run: |
          $testData = Join-Path $env:RUNNER_TEMP 'zt-test-pgdata'
          if ($env:ZT_PG_ROOT -and (Test-Path "$testData/postmaster.pid")) {
            & "$env:ZT_PG_ROOT/bin/pg_ctl.exe" -D $testData -m fast -w stop
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build versioned installer and draft release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      # Fresh checkout: test-generated token launchers never enter the build.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.ZT_PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: source/requirements*.txt

      - name: Install the same pinned dependencies
        run: |
          python -m pip install -r source/requirements-release.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the same PostgreSQL runtime
        run: ./.github/scripts/setup-postgres.ps1 -Destination "$env:RUNNER_TEMP/zt-postgres"

      - name: Build installer
        working-directory: source
        run: |
          $pythonRoot = Split-Path -Parent (Get-Command python).Source
          if (!(Test-Path "$env:SystemRoot/System32/iexpress.exe")) { throw 'IExpress is missing.' }
          python packaging/windows/build_installer.py --postgres-source "$env:ZT_PG_ROOT" --python-source $pythonRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare versioned assets and metadata
        run: |
          $version = $env:GITHUB_REF_NAME
          $installer = 'source/dist/ZeroTrustDemoSetup.exe'
          $asset = "source/dist/ZeroTrust-Setup-$version.exe"
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -eq 0) { throw 'Installer is missing or empty.' }
          Copy-Item -LiteralPath $installer -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash
          "$hash  $(Split-Path $asset -Leaf)" | Set-Content source/dist/SHA256SUMS.txt -Encoding utf8
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "Version: $version"
            "Commit: $commit"
            "Python: $env:ZT_PYTHON_VERSION"
            "PostgreSQL: $env:ZT_PG_VERSION"
            "PostgreSQL archive SHA256: $env:ZT_PG_SHA256"
            'Installer installation test: pending'
          ) | Set-Content source/dist/BUILD-INFO.txt -Encoding utf8
          python -m pip freeze | Set-Content source/dist/DEPENDENCIES.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "Version: $version"
            "Source commit: $commit"
            ''
            'Automated regression tests passed; see the test-results artifact for skipped cases.'
            'Manual installation verification on a disposable Windows environment is required before publication.'
            'Existing installation data is not preserved. This is a demo installer, not a data-preserving updater.'
            'Application policy limitations remain; see docs/POLICY.md.'
          ) | Set-Content source/dist/RELEASE-NOTES.md -Encoding utf8

      - name: Retain assets if release upload needs retry
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.ref_name }}
          path: |
            source/dist/ZeroTrust-Setup-*.exe
            source/dist/SHA256SUMS.txt
            source/dist/BUILD-INFO.txt
            source/dist/DEPENDENCIES.txt
            source/dist/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Create a new draft release without replacing existing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "source/dist/ZeroTrust-Setup-$env:GITHUB_REF_NAME.exe" `
            source/dist/SHA256SUMS.txt source/dist/BUILD-INFO.txt source/dist/DEPENDENCIES.txt `
            --verify-tag --draft --title "ZeroTrust $env:GITHUB_REF_NAME" `
            --notes-file source/dist/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
